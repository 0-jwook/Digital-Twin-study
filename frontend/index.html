<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>myCobot Digital Twin</title>
    <style>
      html, body { margin: 0; height: 100%; background: #14171b; overflow: hidden; }
      #app { position: absolute; inset: 0; }

      #hud {
        position: absolute;
        inset: 0;
        pointer-events: none;
        font-family: ui-monospace, "JetBrains Mono", monospace;
        color: #e7e9ec;
      }
      #hud > * { pointer-events: auto; }

      #status-panel {
        position: absolute;
        top: 16px;
        right: 16px;
        width: 220px;
        background: rgba(20, 23, 27, 0.85);
        border: 1px solid #333a42;
        border-radius: 10px;
        padding: 12px 14px;
        font-size: 12px;
      }
      .status-row { display: flex; justify-content: space-between; margin-bottom: 6px; }
      .label { color: #9aa1ab; }
      .value { font-weight: 700; }
      .value.ok { color: #5fc9bb; }
      .value.bad { color: #e0574d; }
      .value.status-running { color: #5fc9bb; }
      .value.status-error { color: #e0574d; }
      .value.status-stopped, .value.status-stopping { color: #e0b04d; }
      .value.status-idle { color: #9aa1ab; }
      .joint-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 4px 10px;
        margin-top: 8px;
        padding-top: 8px;
        border-top: 1px solid #333a42;
        font-size: 11px;
        color: #9aa1ab;
      }
      .error { color: #e0574d; font-size: 11px; margin-top: 6px; min-height: 14px; }

      #sequence-panel {
        position: absolute;
        left: 50%;
        bottom: 20px;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 10px;
        background: rgba(20, 23, 27, 0.85);
        border: 1px solid #333a42;
        border-radius: 10px;
        padding: 10px 14px;
        font-size: 12px;
      }
      #sequence-panel select, #sequence-panel button,
      #robot-config-panel select, #robot-config-panel input, #robot-config-panel button {
        font-family: inherit;
        font-size: 12px;
        background: #20252b;
        color: #e7e9ec;
        border: 1px solid #333a42;
        border-radius: 6px;
        padding: 6px 10px;
        cursor: pointer;
      }
      #sequence-panel button:disabled, #sequence-panel select:disabled,
      #robot-config-panel button:disabled, #robot-config-panel select:disabled, #robot-config-panel input:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      #sequence-panel button:hover:not(:disabled), #robot-config-panel button:hover:not(:disabled) {
        border-color: #5fc9bb;
      }
      #seq-start { color: #5fc9bb; }
      #seq-stop { color: #e0574d; }
      #seq-reset { color: #e0b04d; }
      #sequence-panel .error { align-self: center; }

      #robot-config-panel {
        position: absolute;
        top: 16px;
        left: 16px;
        display: flex;
        align-items: center;
        gap: 8px;
        background: rgba(20, 23, 27, 0.85);
        border: 1px solid #333a42;
        border-radius: 10px;
        padding: 10px 14px;
        font-size: 12px;
        max-width: 90vw;
        flex-wrap: wrap;
      }
      #robot-config-panel input { cursor: text; width: 90px; }
      #robot-config-panel #rc-active { color: #9aa1ab; font-size: 11px; }
      #robot-config-panel .error { flex-basis: 100%; }

      #connection-banner {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        padding: 8px 16px;
        background: #e0574d;
        color: #1a0d0b;
        font-size: 12px;
        font-weight: 700;
        text-align: center;
      }
      #connection-banner[hidden] { display: none; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hud">
      <div id="connection-banner" hidden></div>
      <div id="robot-config-panel"></div>
      <div id="status-panel"></div>
      <div id="sequence-panel"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
